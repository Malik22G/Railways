<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Railways Game</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body>
    <div class="min-h-screen bg-[#fdfbf4] flex flex-col items-center pt-12 px-4">
        <h1 class="title">RAILWAYS</h1>
        <input type="text" id="playerName" placeholder="WHO ARE YOU?" class="input">
        <div id="difficultySelector">
            <h2 class="text-center mb-4 text-nowrap">SET THE DIFFICULTY!</h2>
            <button class="button easy mb-4" data-difficulty="5">5 X 5 <span class="block text-sm">EASY</span></button>
            <button class="button hard" data-difficulty="7">7 X 7 <span class="block text-sm">HARD</span></button>
        </div>
        <div class="buttons">
            <button id="rulesButton" class="button">RULES</button>
            <button id="startButton" class="button">START GAME</button>
        </div>

        <div id="modal" class="modal ">
            <div class="modal-content">
                <span class="close">&times;</span>
                <h2>Game Rules</h2>
                <p>1. Connect railway tracks to create a continuous path.</p>
                <p>2. The path must use all tracks on the board.</p>
                <p>3. No loops or intersections are allowed.</p>
            </div>
        </div>
        <div class="railway-track"></div>
    </div>

    <div id="gameScreen" class="hidden">
        <div class="container">
            <div class="row p-3">
                <div class="gameDetails col-12 col -sm-6 col-md-4 col-lg-4 my-5 ">
                                <h4 class="">ROUTE DESIGNER</h4>
                                <h2 id="showName" class=""></h2>
                                <hr class="custom-hr">
                                <h4 class="">ELAPSED TIME</h4>
                                <h2 id="timer">00:00</h2>
            
                        </div>
                        <div id="gameArea" class="game-area col-sm-12 col-md-6 col-lg-4 my-3"></div>
                </div>

        </div>
        </div>

    </div>




<div id="modalWin" class="modalWinning" > 
    <div class="modal-content">
        <span id="closeModal" class="close">&times;</span>
        <h2><span id="showNameWinner"></span></h2>
        <div id="leaderBoard">
            <h3>Leaderboard</h3>
            <ol id="leaderBoardList">
            </ol>
        </div>
        <button id="playAgainButton">Play Again</button>
    </div>
</div>

    <script src="game.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
